name: Supply Chain Security

on: [push, pull_request]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Anti-typosquat check
        run: |
          echo "Checking requirements.txt against the trusted allow-list..."
          ALLOWED="requests flask jinja2 click werkzeug"
          FAILED=0
          while IFS= read -r line; do
            # skip blank lines and comments
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            # take the package name (strip version specifiers)
            pkg=$(echo "$line" | sed -E 's/[<>=!~ ].*//' | tr '[:upper:]' '[:lower:]')
            [ -z "$pkg" ] && continue
            if echo " $ALLOWED " | grep -qw "$pkg"; then
              echo "OK: $pkg"
            else
              echo "BLOCKED: '$pkg' is not on the trusted allow-list (possible typosquat)"
              FAILED=1
            fi
          done < requirements.txt
          if [ "$FAILED" -ne 0 ]; then
            echo "Anti-typosquat check failed."
            exit 1
          fi
          echo "All packages are trusted."

      - name: Install dependencies
        run: pip install -r requirements.txt
